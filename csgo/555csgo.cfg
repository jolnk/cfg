//https://developer.valvesoftware.com/wiki/List_of_Counter-Strike:_Global_Offensive_console_commands_and_variables


unbindall
exec config_default

fps_max 400

cl_crosshairgap "-4"
cl_crosshair_outlinethickness "1"
cl_crosshaircolor_r "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "255"
cl_crosshairalpha "255"
cl_crosshair_dynamic_splitdist "3"
//cl_crosshair_recoil "false"
cl_fixedcrosshairgap "3"
cl_crosshaircolor "4"
cl_crosshair_drawoutline "false"
cl_crosshair_dynamic_splitalpha_innermod "0"
cl_crosshair_dynamic_splitalpha_outermod "1"
cl_crosshair_dynamic_maxdist_splitratio "1"
cl_crosshairthickness "1"
cl_crosshairdot "false"
cl_crosshairgap_useweaponvalue "false"
cl_crosshairusealpha "true"
cl_crosshair_t "false"
cl_crosshairstyle "4"
cl_crosshairsize "1"

cl_bob_lower_amt 0
cl_bobamt_lat 0
cl_bobamt_vert 0
cl_bobcycle 0

cl_draw_only_deathnotices 1
cl_drawhud_force_deathnotices 1
cl_drawhud_force_radar 1
cl_drawhud_force_teamid_overhead 1
cl_drawhud_specvote 1

cl_hud_background_alpha 0.5
cl_hud_bomb_under_radar 1
cl_hud_color 0
cl_hud_healthammo_style 0
cl_hud_playercount_pos 0
cl_hud_playercount_showcount 0
cl_hud_radar_scale 1

cl_radar_always_centered 1
cl_radar_icon_scale_min 0.6
cl_radar_rotate 1
cl_radar_scale 0.7
cl_radar_square_with_scoreboard 1

cl_viewmodel_shift_left_amt 1.5
cl_viewmodel_shift_right_amt 0.75

hud_scaling 0.850000 
hud_showtargetid 1
hud_takesshots 0

m_customaccel 0
m_customaccel_exponent 1.05
m_customaccel_max 0
m_customaccel_scale 0.04
m_forward 1
m_mouseaccel1 0
m_mouseaccel2 0
m_mousespeed 1
m_pitch 0.022000
m_rawinput 1
m_side 0.8
m_yaw 0.022

viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1
viewmodel_presetpos 1
viewmodel_recoil 1

sensitivity 1.8

zoom_sensitivity_ratio_mouse 1.0







bind "MWHEELUP" "+jump";
bind "v" "toggle cl_draw_only_deathnotices 0 1;
bind "capslock" "toggleconsole"

alias "crosshair1" "cl_crosshairthickness 0.6; cl_crosshairsize 3; cl_crosshairgap 0; play buttons/blip1; alias crosshair_toggle crosshair2"
alias "crosshair2" "cl_crosshairthickness 0.6; cl_crosshairsize 3; cl_crosshairgap -5; play buttons/blip1; alias crosshair_toggle crosshair3"
alias "crosshair3" "cl_crosshairthickness 1; cl_crosshairsize 1; cl_crosshairgap -4; play buttons/blip1; alias crosshair_toggle crosshair1"

alias "crosshair_toggle" "crosshair1"
bind "," "crosshair_toggle"
