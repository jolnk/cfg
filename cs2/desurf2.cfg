//==================================================
// CS2 Pixelsurf Config
// Original concept by dimablop & spx
// Cleaned for public release
//==================================================

// IMPORTANT:
// This config is calibrated for:
// Sensitivity: 0.69
// m_yaw: 0.022
//
// Website:
// https://cs2-pixelsurf-sensitivity-converter.b12sites.com/
//
// If you use a different sensitivity,
// convert the yaw values before use.
//
// Do not change m_yaw unless you know
// you are using a custom value.

//==================================================
// Default Mouse Yaw
//
// Restores the standard CS2 mouse yaw after each snap.
//
// DO NOT CHANGE THIS UNLESS YOU USE A CUSTOM m_yaw.
// For sensitivity changes, only update the yaw values
// at the bottom of this config.
//==================================================

alias mayaw "m_yaw 0.022"

//==================================================
// Snap Alias Placeholders
//==================================================

alias +snap-90
alias -snap-90

alias +snap90
alias -snap90

alias +snap0
alias -snap0

alias +snap180
alias -snap180


//==================================================
// Movement Aliases
//
// These replace the default movement commands so
// the align system can temporarily take control of
// WASD while a snap is being performed.
//
// Pressing a movement key disables entering align
// mode until the key is released.
// Releasing the key restores the ability to enter
// align mode.
//==================================================

alias +fw "+forward;clearplusalign"
alias -fw "-forward;setplusalign"

alias +ba "+back;clearplusalign"
alias -ba "-back;setplusalign"

alias +le "+left;clearplusalign"
alias -le "-left;setplusalign"

alias +ri "+right;clearplusalign"
alias -ri "-right;setplusalign"

//==================================================
// Snap Orientation
//
// Only RIGHT orientation is included.
// LEFT orientation was removed for simplicity.
//==================================================

// Right orientation
alias sr1 "alias +snap0 +snap0r; alias -snap0 -snap0r"
alias sr2 "alias +snap180 +snap180r; alias -snap180 -snap180r"
alias sr3 "alias +snap90 +snap90r; alias -snap90 -snap90r"
alias sr4 "alias +snap-90 +snap-90r; alias -snap-90 -snap-90r"


//==================================================
// Binding Modes
//
// bindwasd restores normal movement.
//
// bindsnap temporarily converts WASD into snap
// selection keys.
//==================================================

alias bindwasd "bind w +fw; bind a +le; bind s +ba; bind d +ri"

alias bindsnap "clearmovement; bind w +snap0; bind s +snap180; bind a +snap90; bind d +snap-90"


//==================================================
// USER SETTINGS
//
// Change KEY to whatever key you want to use
// for entering pixelsurf align mode.
//
// Example:
// bind KEY +align
//==================================================

bind alt +align

//==================================================
// Default Snap Orientation
//
// Select the default snap direction on startup.
//==================================================

sr1
sr2
sr3
sr4

echo PIXELSURF ENABLED
echo MODE: RIGHT


//==================================================
// Align State Management
//
// These aliases control when align mode can be
// entered and exited.
//==================================================

alias clearplusalign "alias +align"
alias clearminusalign "alias -align"

alias setplusalign  "alias +align bindsnap"
alias setminusalign "alias -align \"bindwasd; bind mouse_x yaw\""


//==================================================
// Movement Reset
//
// Ensures forward movement is released before
// switching WASD into snap mode.
//==================================================

alias clearmovement "-fw"


//==================================================
// Align Mode
//
// Holding the align key:
//
// • Disables mouse movement
// • Converts WASD into snap keys
//
// Releasing the key:
//
// • Restores normal WASD
// • Restores mouse movement
//==================================================

alias +align "bindsnap; unbind mouse_x"
alias -align "bindwasd; bind mouse_x yaw"


// Shortcut
alias bwasd "bindwasd"

///==================================================
// Snap Actions
//
// Calibrated for:
// Sensitivity: 0.69
// m_yaw: 0.022
//==================================================


//--------------------------------------------------
// -90° RIGHT
//--------------------------------------------------

alias +snap-90r "m_yaw 12000000000; yaw 1 1 1; clearminusalign"
alias -snap-90r "mayaw; yaw 5932.147763 1 -1; setminusalign; bind mouse_x yaw; bind mouse_y pitch; bwasd"


//--------------------------------------------------
// 90° LEFT
//--------------------------------------------------

alias +snap90r "m_yaw 12000000000; yaw 1 1 1; clearminusalign"
alias -snap90r "mayaw; yaw -5925.560150 1 -1; setminusalign; bind mouse_x yaw; bind mouse_y pitch; bwasd"


//--------------------------------------------------
// 0°
//--------------------------------------------------

alias +snap0r "m_yaw 12000000000; yaw 1 1 1; clearminusalign"
alias -snap0r "mayaw; yaw 3.293808 1 -1; setminusalign; bind mouse_x yaw; bind mouse_y pitch; bwasd"


//--------------------------------------------------
// 180°
//--------------------------------------------------

alias +snap180r "m_yaw 12000000000; yaw 1 1 1; clearminusalign"
alias -snap180r "mayaw; yaw 11861.000272 1 -1; setminusalign; bind mouse_x yaw; bind mouse_y pitch; bwasd"


//==================================================
// Startup Reset
//
// Ensures normal mouse movement when loading config.
//==================================================

bindwasd
bind mouse_x yaw
bind mouse_y pitch

//==================================================
//enjoy
//==================================================
