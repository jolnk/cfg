// made by nilfint n wortixd (john)

alias mayaw "m_yaw 0.022;sensitivity 3.11"
alias fix

// binds (u can change that)

// 0.05
bind uparrow +snap0fine

// 180.00
bind downarrow +snap180fine

// 90.05
bind rightarrow +snap90fine

// -90.05
bind leftarrow +snap-90fine

// 89.96
bind rctrl +snap90ctrl


// ALIASES DONT TOUCH ! ! !

alias +snap-90
alias -snap-90

alias +snap90
alias -snap90

alias +snap0
alias -snap0

alias +snap180
alias -snap180

// snap

alias togglesnap snapright

alias snapright "sr1;sr2;sr3;sr4;alias togglesnap snapleft"
alias snapleft "sl1;sl2;sl3;sl4;alias togglesnap snapright"

togglesnap

// right
alias sr1 "alias +Snap0 +snap0r;alias -snap0 -snap0r"
alias sr2 "alias +Snap180 +snap180r;alias -snap180 -snap180r"
alias sr3 "alias +Snap90 +snap90r;alias -snap90 -snap90r"
alias sr4 "alias +Snap-90 +snap-90r;alias -snap-90 -snap-90r"

// left
alias sl1 "alias +Snap0 +snap0l;alias -snap0 -snap0l"
alias sl2 "alias +Snap180 +snap180l;alias -snap180 -snap180l"
alias sl3 "alias +Snap90 +snap90l;alias -snap90 -snap90l"
alias sl4 "alias +Snap-90 +snap-90l;alias -snap-90 -snap-90l"

alias +snap-90r "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap-90r "mayaw;yaw 1316.136 1 -1"

alias +snap-90l "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap-90l "mayaw;yaw 1314.674 1 -1"

alias +snap90r "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap90r "mayaw;yaw -1314.674 1 -1"

alias +snap90l "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap90l "mayaw;yaw -1316.136 1 -1"

alias +snap0r "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap0r "mayaw;yaw 0.731 1 -1"

alias +snap0l "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap0l "mayaw;yaw -0.731 1 -1"

alias +snap180r "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap180r "mayaw;yaw 2631.540 1 -1"

alias +snap180l "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap180l "mayaw;yaw -2631.540 1 -1"

// right arrow 90.05
alias +snap-90fine "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap-90fine "mayaw;yaw 1316.136 1 -1"

// left arrow 90.05
alias +snap90fine "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap90fine "mayaw;yaw -1316.136 1 -1"

// right ctrl 89.96
alias +snap90ctrl "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap90ctrl "mayaw;yaw -1314.820 1 -1"

// up arrow 0.05
alias +snap0fine "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap0fine "mayaw;yaw 0.731 1 -1"

// down arrow 180.00
alias +snap180fine "sensitivity 3.11; m_yaw 12000000000; yaw 1 1 1;"
alias -snap180fine "mayaw;yaw 2631.540 1 -1"