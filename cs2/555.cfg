

//apr 7 2026
//1280x960 180HZ
//amd rx 7600 amd ryzen 5700x

//mouse pointer speed 6
//enhance pointer precision off (disabled mouse acceleration)


//created by ???
//good practice always do unbindall, binddefaults then exec 555.cfg
//also insert on launch options +exec 555.cfg


//https://developer.valvesoftware.com/wiki/List_of_Counter-Strike_2_console_commands_and_variables





unbindall
binddefaults

fps_max "0"

cl_crosshair_drawoutline "0"
cl_crosshair_dynamic_maxdist_splitratio "1"
cl_crosshair_dynamic_splitalpha_innermod "0"
cl_crosshair_dynamic_splitalpha_outermod "1"
cl_crosshair_dynamic_splitdist "3"
cl_crosshair_dynamic_spread_limit "227"
cl_crosshair_gap "1"
cl_crosshair_length "2"
cl_crosshair_recoil "false"
cl_crosshair_screen_height "960"
cl_crosshair_sniper_width "1"
cl_crosshair_t "false"
cl_crosshair_thickness "2"
cl_crosshairalpha "255"
cl_crosshaircolor_a "255"
cl_crosshaircolor_b "255"
cl_crosshaircolor_g "255"
cl_crosshaircolor_r "0"
cl_crosshairdot "false"
cl_crosshairsize "1"
cl_crosshairstyle "4"
cl_crosshairthickness "1"

cl_debounce_zoom "true"

cl_draw_only_deathnotices "1"
cl_drawhud_force_deathnotices "1"
cl_drawhud_force_radar "1"
cl_drawhud_force_teamid_overhead "1"
cl_drawhud_specvote "1"

cl_hud_color "1"
cl_hud_radar_scale "1"

cl_radar_always_centered "true"
cl_radar_icon_scale_min "0.6"
cl_radar_rotate "true"
cl_radar_scale "0.7"
cl_radar_scale_alternate "1"
cl_radar_scale_dynamic "false"
cl_radar_show_all_players_when_spectating "true"
cl_radar_square_always "false"
cl_radar_square_when_spectating	"true"
cl_radar_square_with_scoreboard	"true"

hud_fastswitch "0"
hud_scaling	"1"
hud_showtargetid "true"

m_pitch	"0.022"
m_yaw "0.022"

sensitivity "1.8"
sensitivity_y_scale	"1"

zoom_sensitivity_ratio"	"1"







bind "SPACE" "+jump"
bind "MWHEELUP" "+jump"
bind "CAPSLOCK"	"toggle cl_radar_scale 0.7 1"
bind "MOUSE4"	"switchhands"
bind "MOUSE5" "+voicerecord"
bind "v" "toggle cl_draw_only_deathnotices 0 1; cl_drawhud_force_deathnotices 0 1; toggle cl_drawhud_force_radar 0 1; cl_drawhud_force_teamid_overhead 0 1"

bind "4" "slot4"
bind "x" "slot7"
bind "z" "slot8"

bind "/" "toggle cl_crosshairthickness 2 3; toggle cl_crosshair_gap 0; toggle cl_crosshair_length 4 3"

alias cc0 "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; play buttons/blip1; alias cc cc1"        // red
alias cc1 "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 255; cl_crosshaircolor_b 0; play buttons/blip1; alias cc cc2"        // green
alias cc2 "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 0; play buttons/blip1; alias cc cc3"      // yellow
alias cc3 "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 0; cl_crosshaircolor_b 255; play buttons/blip1; alias cc cc4"        // blue
alias cc4 "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255; play buttons/blip1; alias cc cc5"      // cyan
alias cc5 "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255; play buttons/blip1; alias cc cc6"    // white
alias cc6 "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; play buttons/blip1; alias cc cc7"          // black
alias cc7 "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 255; play buttons/blip1; alias cc cc0"      // magenta

alias "cc" "cc0"
bind "." "cc"

alias "crosshair0" "cl_crosshair_gap 1; cl_crosshair_length 2; cl_crosshair_thickness 2; play buttons/blip1; alias crosshair_toggle crosshair1"
alias "crosshair1" "cl_crosshair_gap 5; cl_crosshair_length 6; cl_crosshair_thickness 1; play buttons/blip1; alias crosshair_toggle crosshair2"
alias "crosshair2" "cl_crosshair_gap 0; cl_crosshair_length 6; cl_crosshair_thickness 1; play buttons/blip1; alias crosshair_toggle crosshair0"

alias "crosshair_toggle" "crosshair0"
bind "," "crosshair_toggle"

alias vm0 "viewmodel_fov 68.000000; viewmodel_offset_x -2.000000; viewmodel_offset_y 2.000000; viewmodel_offset_z -2.000000; play tools/sfm/denyundo; alias vm vm1"     //doom
alias vm1 "viewmodel_fov 68.000000; viewmodel_offset_x 2.500000; viewmodel_offset_y 0.000000; viewmodel_offset_z -1.500000; play tools/sfm/denyundo; alias vm vm2"      //classic
alias vm2 "viewmodel_fov 68; viewmodel_offset_x 2.400000; viewmodel_offset_y 2.0; viewmodel_offset_z -2; viewmodel_presetpos 0; play tools/sfm/denyundo; alias vm vm3"  //opher
alias vm3 "viewmodel_fov 68.000000; viewmodel_offset_x 2.500000; viewmodel_offset_y 2.000000; viewmodel_offset_z -2.000000; play tools/sfm/denyundo; alias vm vm4"      //hl
alias vm4 "viewmodel_fov 68; viewmodel_offset_x 2.5; viewmodel_offset_y 0.4; viewmodel_offset_z -3; viewmodel_presetpos 3; play tools/sfm/denyundo; alias vm vm0"       //g

alias "vm" "vm0"
bind "l" "vm"

//alias +spinbot "m_yaw 666";alias -spinbot "m_yaw 0.022";bind z +spinbot

snd_toolvolume "0.1"



