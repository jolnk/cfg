

//apr 7 2026
//1280x960 180HZ
//amd rx 7600 amd ryzen 5700x

//mouse pointer speed 6
//enhance pointer precision off (disabled mouse acceleration)


//created by ???
//good practice always do unbindall, binddefaults then exec 555.cfg
//also insert on launch options +exec 555.cfg


//https://developer.valvesoftware.com/wiki/List_of_Counter-Strike_2_console_commands_and_variables





unbindall
binddefaults

fps_max 0

//cl_crosshairgap "-4"
//cl_crosshair_outlinethickness "1"
//cl_crosshaircolor_r "0"
//cl_crosshaircolor_g "255"
//cl_crosshaircolor_b "255"
cl_crosshairalpha "255"
cl_crosshair_dynamic_splitdist "3"
cl_crosshair_recoil "false"
//cl_fixedcrosshairgap "3"
//cl_crosshaircolor "4"
//cl_crosshair_drawoutline "false"
cl_crosshair_dynamic_splitalpha_innermod "0"
cl_crosshair_dynamic_splitalpha_outermod "1"
cl_crosshair_dynamic_maxdist_splitratio "1"
//cl_crosshairthickness "1"
//cl_crosshairdot "false"
//cl_crosshairgap_useweaponvalue "false"
//cl_crosshairusealpha "true"
//cl_crosshair_t "false"
//cl_crosshairstyle "4"
//cl_crosshairsize "1"

cl_debounce_zoom 1

cl_hud_color 1
cl_hud_radar_scale 1

cl_draw_only_deathnotices 1
cl_drawhud_force_deathnotices 1
cl_drawhud_force_radar 1
cl_drawhud_force_teamid_overhead 1
cl_drawhud_specvote 1

hud_fastswitch 0
hud_scaling 1
hud_showtargetid 1

sensitivity 1.8

sensitivity_y_scale 1

zoom_sensitivity_ratio 1







bind "space" "+jump"
bind "MWHEELUP" "+jump"
bind "capslock" "toggle cl_radar_scale 0.3 1"
bind "v" "toggle cl_draw_only_deathnotices 0 1; cl_drawhud_force_radar 0 1"
bind "mouse4" "switchhands"
bind "mouse5" "+voicerecord"

alias ch0 "cl_crosshaircolor 0; play buttons/blip1; alias chtoggle ch1" // Red
alias ch1 "cl_crosshaircolor 1; play buttons/blip1; alias chtoggle ch2" // Green
alias ch2 "cl_crosshaircolor 2; play buttons/blip1; alias chtoggle ch3" // Yellow
alias ch3 "cl_crosshaircolor 3; play buttons/blip1; alias chtoggle ch4" // Blue
alias ch4 "cl_crosshaircolor 4; play buttons/blip1; alias chtoggle ch5" // Cyan
alias ch5 "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255; play buttons/blip1; alias chtoggle ch6" // White
alias ch6 "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; play buttons/blip1; alias chtoggle ch7" // Black
alias ch7 "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 255; play buttons/blip1; alias chtoggle ch0" // Magenta

alias chtoggle ch0
bind "." "chtoggle"

alias "crosshair1" "cl_fixedcrosshairgap 3; cl_crosshairusealpha true; cl_crosshairthickness 0.6; cl_crosshairstyle 4; cl_crosshairsize 3; cl_crosshairgap_useweaponvalue false; cl_crosshairgap 0; cl_crosshairdot false; cl_crosshair_t false; cl_crosshair_sniper_width 1; cl_crosshair_outlinethickness 1; cl_crosshair_drawoutline false; play buttons/blip1; alias crosshair_toggle crosshair2"
alias "crosshair2" "cl_fixedcrosshairgap 3; cl_crosshairusealpha true; cl_crosshairthickness 0.6; cl_crosshairstyle 4; cl_crosshairsize 3; cl_crosshairgap_useweaponvalue false; cl_crosshairgap -5; cl_crosshairdot false; cl_crosshair_t false; cl_crosshair_sniper_width 1; cl_crosshair_outlinethickness 1; cl_crosshair_drawoutline false; play buttons/blip1; alias crosshair_toggle crosshair3"
alias "crosshair3" "cl_fixedcrosshairgap 3; cl_crosshairusealpha 1; cl_crosshairthickness 1; cl_crosshairstyle 4; cl_crosshairsize 1; cl_crosshairgap_useweaponvalue 0; cl_crosshairgap -4; cl_crosshairdot 0; cl_crosshair_t 0; cl_crosshair_recoil 0; cl_crosshair_outlinethickness 1; cl_crosshair_drawoutline 0; play buttons/blip1; alias crosshair_toggle crosshair1"

alias "crosshair_toggle" "crosshair1"
bind "," "crosshair_toggle"

alias vm0 "viewmodel_fov 68.000000; viewmodel_offset_x -2.000000; viewmodel_offset_y 2.000000; viewmodel_offset_z -2.000000; play tools/sfm/denyundo; alias vm vm1"	//doom
alias vm1 "viewmodel_fov 68.000000; viewmodel_offset_x 2.500000; viewmodel_offset_y 0.000000; viewmodel_offset_z -1.500000; play tools/sfm/denyundo; alias vm vm2"	//classic
alias vm2 "viewmodel_fov 68; viewmodel_offset_x 2.400000; viewmodel_offset_y 2.0; viewmodel_offset_z -2; viewmodel_presetpos 0; play tools/sfm/denyundo; alias vm vm3"	//opher
alias vm3 "viewmodel_fov 68.000000; viewmodel_offset_x 2.500000; viewmodel_offset_y 2.000000; viewmodel_offset_z -2.000000; play tools/sfm/denyundo; alias vm vm4"	//hl
alias vm4 "viewmodel_fov 68; viewmodel_offset_x 2.5; viewmodel_offset_y 0.4; viewmodel_offset_z -3; viewmodel_presetpos 3; play tools/sfm/denyundo; alias vm vm0"	//g

alias vm "vm0"
bind "l" "vm"

alias moan0 "cl_crosshair_drawoutline true; cl_crosshair_outlinethickness 1; play player/death_fem_06; alias moan moan1"
alias moan1 "cl_crosshair_drawoutline true; cl_crosshair_outlinethickness 0.5; play player/death_fem_08; alias moan moan2"
alias moan2 "cl_crosshair_drawoutline false; cl_crosshair_outlinethickness 1; play player/death_fem_04; alias moan moan0"

alias moan "moan0"
bind "/" "moan"

//alias +spinbot "m_yaw 666";alias -spinbot "m_yaw 0.022";bind z +spinbot

snd_toolvolume 0.1



