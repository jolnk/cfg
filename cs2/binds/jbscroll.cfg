// JUMPBUG BIND (NO MANUAL CROUCH) - jbscroll.cfg

unbind mouse_wheel;
bind mwheeldown +jump;	mwheeldown replace with mwheelup
alias lj "";
alias lj1 "";
bind a "+left";
bind d "+right";
alias +j "jump 1 0 0";
alias -j "jump -999 0 0";
alias +tick "duck 1 0 0";
alias -tick "bind mwheelup +tick1"; //mwheeldown replace with mwheelup
alias +tick1 "duck -999 0 0";
alias -tick1 "jump 1 0 0;bind mwheelup +j"; //mwheeldown replace with mwheelup

alias +reset "+forward;bind mwheelup +tick"; //mwheeldown replace with mwheelup
alias -reset "-forward";
bind w +reset;