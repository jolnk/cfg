// LONGJUMP BIND - ljscroll.cfg

alias +j "jump 1 0 0";
alias -j "jump -999 0 0";
alias lj "jump 1 0 0;bind mouse_wheel lj1";
alias lj1 "bind mouse_wheel -j"; //alias lj1 "+left;bind mouse_wheel -j";
alias +tick "duck 1 0 0";
alias -tick "forward -999 0 0;bind mwheeldown +tick1";	//mwheeldown replace with mwheelup
alias +tick1 "duck -999 0 0";
alias -tick1 "jump -999 0 0;bind mwheeldown +j"; //mwheeldown replace with mwheelup
alias +reset "+forward;bind mwheeldown +tick;bind mouse_wheel lj"; //mwheeldown replace with mwheelup
alias -reset "-forward";
bind w +reset;
alias +a "+left";
alias -a "left -999 0 0";
alias +d "+right";
alias -d "right -999 0 0";
bind a +a;
bind d +d;